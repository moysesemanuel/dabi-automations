name: dabi-automations

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dabi
      POSTGRES_PASSWORD: dabi
      POSTGRES_DB: dabi
    ports: ["5440:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    # 6390 no host: a 6379 costuma estar ocupada por um Redis nativo de outros projetos
    ports: ["6390:6379"]
volumes:
  pgdata:
