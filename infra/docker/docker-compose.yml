name: dabi-automations

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dabi
      POSTGRES_PASSWORD: dabi
      POSTGRES_DB: dabi
    ports: ["5440:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
